server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Vite puts hashed, never-changing files in /assets, so cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to index.html so client-side routes survive a refresh
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}